# Included only by Embodied Lab locations. Credentials stay on the server.
auth_basic "Embodied Lab";
auth_basic_user_file /etc/nginx/embodied-lab.htpasswd;
proxy_pass http://127.0.0.1:8092;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
# This listener is reachable only through the local HTTPS Cloudflare Tunnel.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Authorization "";
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_read_timeout 300s;
proxy_buffering off;
client_max_body_size 10m;
add_header Cache-Control "private, no-store" always;
add_header X-Content-Type-Options nosniff always;
