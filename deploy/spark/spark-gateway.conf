# Example: an HTTPS tunnel targets localhost:8088.
# An optional pre-existing homepage listens on 8089.
map $http_upgrade $spark_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8088;
    listen [::1]:8088;
    server_name lab.example.com localhost;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location ~ ^/(simulation|training|grasp|health)(/|$) {
        include /etc/nginx/snippets/embodied-lab-proxy.conf;
    }
    location ^~ /static/ {
        include /etc/nginx/snippets/embodied-lab-proxy.conf;
    }
    location ~ ^/workbench(/|$) {
        include /etc/nginx/snippets/embodied-lab-proxy.conf;
    }
    location ~ ^/api/(simulation|overview|rounds|datasets|runs|jobs|grasp|lab)(/|$) {
        include /etc/nginx/snippets/embodied-lab-proxy.conf;
    }
    location = /v1/systemone {
        include /etc/nginx/snippets/embodied-lab-proxy.conf;
    }

    # Preserve the existing homepage, API, static assets, SSE and WebSocket.
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spark_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
