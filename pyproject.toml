[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-lab"
version = "0.1.0"
description = "A measured robot decision learning loop with a live training dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psutil>=6,<8", "pillow>=11,<13", "mujoco==3.13.0", "keyring>=25.6,<26", "filelock>=3.16,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.11"]
plots = ["matplotlib>=3.9"]
video = ["imageio[ffmpeg]>=2.37"]
minicpm = ["torch>=2.6", "transformers==4.57.6", "accelerate>=1.0"]

[project.scripts]
embodied-lab = "embodied_lab.cli:main"
embodied-jev = "embodied_jev.cli:main"
embodied-rsi = "embodied_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_rsi = ["web/*"]
embodied_jev = ["assets/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
